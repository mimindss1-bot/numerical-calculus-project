name: Verify numerical calculus
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test numerical methods and validation
        run: python -m unittest discover -s tests -v
      - name: Execute notebook in isolation and verify generated results
        run: python verify_notebook.py
      - name: Save executed report and numerical results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-report-python-${{ matrix.python-version }}
          path: |
            numerical_calculus.ipynb
            numerical_calculus.html
            results/
          retention-days: 14
